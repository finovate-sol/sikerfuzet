<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belépés – Sikerfüzet</title>
    <style>
        :root {
            --navy:#0f2f5f; --blue:#1f5fd0; --blue-light:#e8f0fc; --bg:#f0f3f7;
            --text:#1c2b45; --muted:#6b7a90; --border:#e2e8f0; --red:#dc2626; --amber:#b45309;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, #0f2f5f 0%, #1f5fd0 100%); padding:20px;
        }
        .login-card {
            background:#fff; width:100%; max-width:400px; border-radius:16px; padding:40px 34px;
            box-shadow:0 20px 50px rgba(10,37,71,.35); text-align:center;
        }
        .logo { font-size:26px; font-weight:800; color:var(--navy); letter-spacing:.3px; }
        .tagline { color:var(--muted); font-size:14px; margin-top:4px; }
        .divider-line { height:1px; background:var(--border); margin:26px 0; }
        h1 { font-size:18px; color:var(--navy); margin-bottom:6px; }
        .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
        .google-btn {
            width:100%; display:flex; align-items:center; justify-content:center; gap:11px;
            padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:#fff;
            font-size:15px; font-weight:600; color:var(--text); cursor:pointer; transition:background .15s, box-shadow .15s;
        }
        .google-btn:hover { background:#f7f9fc; box-shadow:0 2px 6px rgba(15,47,95,.08); }
        .google-btn:disabled { opacity:.55; cursor:not-allowed; }
        .google-btn svg { width:20px; height:20px; }
        .msg { margin-top:18px; font-size:13px; border-radius:9px; padding:11px 14px; text-align:left; display:none; }
        .msg.error { background:#fdeaea; color:var(--red); display:block; }
        .msg.warn  { background:#fef3e2; color:var(--amber); display:block; }
        .msg.info  { background:var(--blue-light); color:var(--navy); display:block; }
        .foot { margin-top:26px; font-size:12px; color:var(--muted); }
        .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:var(--blue);
            border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:middle; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">Sikerfüzet</div>
        <div class="tagline">Tervezd. Kövesd. Valósítsd meg.</div>
        <div class="divider-line"></div>
        <h1>Belépés</h1>
        <p class="sub">Lépj be a Google-fiókoddal a folytatáshoz.</p>

        <button class="google-btn" id="googleBtn">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span id="googleBtnLabel">Belépés Google-fiókkal</span>
        </button>

        <div class="msg" id="msg"></div>

        <div class="foot">© 2025 Sikerfüzet · Csak engedélyezett munkatársak léphetnek be.</div>
    </div>

    <script type="module">
        import { loginWithGoogle, redirectIfLoggedIn, isConfigured } from "./auth.js";

        const btn = document.getElementById("googleBtn");
        const label = document.getElementById("googleBtnLabel");
        const msg = document.getElementById("msg");

        function showMsg(text, type){ msg.className = "msg " + type; msg.textContent = text; }

        // "denied=1" query paraméter → hozzáférés megtagadva üzenet
        if (new URLSearchParams(location.search).get("denied")) {
            showMsg("Ehhez az e-mail címhez nincs hozzáférés. Kérd az adminisztrátortól a felvételt.", "error");
        }

        if (!isConfigured) {
            showMsg("A Firebase beállítás még folyamatban van – a belépés hamarosan aktív lesz.", "warn");
        } else {
            redirectIfLoggedIn();
        }

        btn.addEventListener("click", async () => {
            btn.disabled = true;
            const original = label.textContent;
            label.innerHTML = '<span class="spinner"></span>';
            msg.className = "msg";
            try {
                await loginWithGoogle();
                window.location.href = "index.html";
            } catch (e) {
                showMsg(e.message || "A belépés nem sikerült. Próbáld újra.", "error");
                btn.disabled = false;
                label.textContent = original;
            }
        });
    </script>
</body>
</html>
