<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belépés – Sikerfüzet</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="theme-color" content="#0f2f5f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sikerfüzet">
    <style>
        :root {
            --navy:#0f2f5f; --navy-dark:#0a2547; --blue:#1f5fd0; --blue-light:#e8f0fc; --bg:#f0f3f7;
            --text:#1c2b45; --muted:#6b7a90; --border:#e2e8f0; --red:#dc2626; --amber:#b45309; --green:#16a34a;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        html, body { height:100%; }
        body {
            font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:var(--navy);
            padding:20px;
        }
        .login-card {
            position:relative; z-index:1; background:#fff; width:100%; max-width:400px; border-radius:22px;
            padding:44px 34px 34px; box-shadow:0 24px 60px rgba(5,20,42,.45); text-align:center;
        }
        .login-icon {
            width:72px; height:72px; border-radius:20px; margin:0 auto 18px; background:var(--navy);
            display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(15,47,95,.35);
        }
        .login-icon svg { width:40px; height:40px; }
        .logo { font-size:25px; font-weight:800; color:var(--navy); letter-spacing:.3px; }
        .tagline { color:var(--muted); font-size:13.5px; margin-top:4px; }
        .divider-line { height:1px; background:var(--border); margin:24px 0; }
        .greeting { font-size:19px; font-weight:800; color:var(--navy); margin-bottom:6px; }
        .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
        .google-btn {
            width:100%; display:flex; align-items:center; justify-content:center; gap:11px;
            padding:13px 16px; border:1px solid var(--border); border-radius:11px; background:#fff;
            font-size:15px; font-weight:600; color:var(--text); cursor:pointer; transition:background .15s, box-shadow .15s, border-color .15s;
        }
        .google-btn:hover { background:#f7f9fc; box-shadow:0 4px 12px rgba(15,47,95,.1); border-color:#d5deea; }
        .google-btn:disabled { opacity:.55; cursor:not-allowed; }
        .google-btn svg { width:20px; height:20px; }
        .msg { margin-top:18px; font-size:13px; border-radius:9px; padding:11px 14px; text-align:left; display:none; }
        .msg.error { background:#fdeaea; color:var(--red); display:block; }
        .msg.warn  { background:#fef3e2; color:var(--amber); display:block; }
        .msg.info  { background:var(--blue-light); color:var(--navy); display:block; }
        .foot { margin-top:26px; font-size:12px; color:var(--muted); }
        .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:var(--blue);
            border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:middle; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">
            <svg viewBox="0 0 512 512">
                <path d="M 96 172 C 160 140 224 140 256 168 C 288 140 352 140 416 172 L 416 344 C 352 312 288 312 256 340 C 224 312 160 312 96 344 Z" fill="#ffffff"/>
                <line x1="256" y1="168" x2="256" y2="340" stroke="var(--navy)" stroke-width="7"/>
                <circle cx="378" cy="378" r="62" fill="var(--green)"/>
                <path d="M 350 378 L 370 398 L 408 356" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="logo">Sikerfüzet</div>
        <div class="tagline">Tervezd. Kövesd. Valósítsd meg.</div>
        <div class="divider-line"></div>
        <h1 class="greeting" id="greeting">Szia!</h1>
        <p class="sub">Lépj be a Google-fiókoddal a folytatáshoz.</p>

        <button class="google-btn" id="googleBtn">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span id="googleBtnLabel">Belépés Google-fiókkal</span>
        </button>

        <div class="msg" id="msg"></div>

        <div class="foot">© 2025 Sikerfüzet · Csak engedélyezett munkatársak léphetnek be.</div>
    </div>

    <script type="module">
        import { loginWithGoogle, redirectIfLoggedIn, isConfigured } from "./auth.js?v=2";

        const btn = document.getElementById("googleBtn");
        const label = document.getElementById("googleBtnLabel");
        const msg = document.getElementById("msg");
        const greetingEl = document.getElementById("greeting");

        function showMsg(text, type){ msg.className = "msg " + type; msg.textContent = text; }

        // Napszaknak megfelelő üdvözlés
        (function(){
            const h = new Date().getHours();
            const text = h < 5 ? "Szia!" : h < 10 ? "Jó reggelt!" : h < 18 ? "Szép napot!" : h < 23 ? "Jó estét!" : "Szia!";
            greetingEl.textContent = text;
        })();

        // "denied=1" query paraméter → hozzáférés megtagadva üzenet
        if (new URLSearchParams(location.search).get("denied")) {
            showMsg("Ehhez az e-mail címhez nincs hozzáférés. Kérd az adminisztrátortól a felvételt.", "error");
        }

        if (!isConfigured) {
            showMsg("A Firebase beállítás még folyamatban van – a belépés hamarosan aktív lesz.", "warn");
        } else {
            redirectIfLoggedIn();
        }

        btn.addEventListener("click", async () => {
            btn.disabled = true;
            const original = label.textContent;
            label.innerHTML = '<span class="spinner"></span>';
            msg.className = "msg";
            try {
                await loginWithGoogle();
                window.location.href = "index.html";
            } catch (e) {
                showMsg(e.message || "A belépés nem sikerült. Próbáld újra.", "error");
                btn.disabled = false;
                label.textContent = original;
            }
        });
    </script>
</body>
</html>
