<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#fbfaf7; --card:#ffffff; --ink:#22201c; --ink2:#4a463f; --muted:#8b867c; --line:#efebe3; --line2:#ddd7cb; --soft:#f2efe8;
 --acc:#ff7a45; --acc-t:#ffe4d6; --ok:#3f9a5c; --ok-t:#e1f3d8; --warn:#d99a1b; --warn-t:#fdf0d2; --err:#e0514a; --err-t:#fde2df;
 /* életterületek: háttér + tinta */
 --naplo:#ffe4d6; --naplo-i:#e35d22; --penz:#d9ecff; --penz-i:#2f6fb5; --szokas:#e9e2ff; --szokas-i:#6b4fd6; --egeszseg:#e1f3c9; --egeszseg-i:#4f8a1f;
 --cel:#fff1c7; --cel-i:#b07d06; --kapcs:#ffe0ec; --kapcs-i:#c93f74; --fejl:#d8f3ec; --fejl-i:#1f8a71; --otthon:#efe7da; --otthon-i:#8a6a3e;
 --r-s:12px; --r-m:18px; --r-l:26px; --font:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:#ecebe6;font-family:var(--font);color:var(--ink);padding:40px 36px 60px}
.lap{max-width:1260px;margin:0 auto}
.fo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.fo h1{font-size:40px;font-weight:800;letter-spacing:-1px}.fo p{color:var(--muted);font-size:16px;margin-top:4px}
.blokk{background:var(--bg);border-radius:30px;padding:28px 30px;margin-bottom:22px}
.blokk>h2{font-size:24px;font-weight:700;letter-spacing:-.4px;display:flex;gap:10px;align-items:center}
.blokk>h2 span{font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px;letter-spacing:0}
.blokk>p.m{color:var(--muted);font-size:14.5px;margin:6px 0 18px;max-width:900px;line-height:1.5}
.cim3{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.racs{display:grid;gap:14px}
/* színek */
.sz{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.sz i{display:block;height:64px}.sz div{padding:9px 12px;font-size:13px}.sz b{display:block;font-weight:700}.sz em{font-style:normal;color:var(--muted);font-size:12px}
.ter{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.ter .ik{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.ter b{font-size:15px}.ter em{font-style:normal;font-size:12px;opacity:.8}
svg.l{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* tipó */
.tipo div{display:flex;align-items:baseline;gap:22px;padding:10px 0;border-bottom:1px solid var(--line)}
.tipo code{width:190px;flex:none;font:600 12.5px ui-monospace,monospace;color:var(--muted)}
/* tokenek */
.tok{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.tok .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
/* komponensek */
.komp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kk{background:var(--card);border-radius:22px;border:1px solid var(--line);padding:16px}
.kk h4{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.btn{height:50px;border-radius:16px;border:0;font:700 16px var(--font);padding:0 20px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.fo1{background:var(--acc);color:#fff;width:100%}.btn.mas{background:var(--soft);color:var(--ink)}.btn.szov{background:none;color:var(--acc);padding:0 6px}
.btn.kis{height:38px;border-radius:12px;font-size:14px;padding:0 14px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 22px rgba(255,122,69,.35);color:#fff}
.fab svg.l{width:26px;height:26px}
.chip{height:36px;border-radius:999px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}.seg span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-height:118px}
.stat .c{font-size:12.5px;font-weight:600;opacity:.75}.stat .v{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}.stat .v small{font-size:13px;font-weight:600;opacity:.7;margin-left:3px;letter-spacing:0}
.stat .s{font-size:12px;opacity:.75;margin-top:auto}
.sav{height:7px;border-radius:6px;background:rgba(0,0,0,.07);margin-top:8px}.sav i{display:block;height:100%;border-radius:6px}
.sor{display:flex;align-items:center;gap:12px;padding:11px 0}.sor+.sor{border-top:1px solid var(--line)}
.sor .ik{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sor b{flex:1;font-size:15px;font-weight:600}.sor b em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}
.sor .j{font-weight:700;font-size:15px}
.pipa{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:#fff}.pipa.on{background:var(--acc);border-color:var(--acc)}.pipa svg.l{width:16px;height:16px;stroke-width:2.4}
.gyuru{position:relative;width:86px;height:86px}.gyuru b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700}
.het{display:flex;justify-content:space-between}.het div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.het i{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--naplo-i)}
.het i.van{background:var(--naplo)}.het .ma i{background:transparent;outline:2px dashed var(--acc);outline-offset:-2px}
.hangok{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.hang{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:16px;background:var(--soft);font-size:11.5px;font-weight:600;color:var(--muted)}
.hang svg.l{width:30px;height:30px;stroke-width:1.5;color:var(--ink2)}.hang.on{background:var(--naplo);color:var(--naplo-i)}.hang.on svg.l{color:var(--naplo-i)}
.mezo{height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:15.5px}
.mezo.fok{background:#fff;outline:2px solid var(--acc);color:var(--ink)}
.kapcs{width:50px;height:30px;border-radius:999px;background:var(--acc);position:relative}.kapcs::after{content:'';position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.kapcs.ki{background:var(--line2)}.kapcs.ki::after{right:auto;left:3px}
.sheet{background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.08);padding:8px 16px 16px;border:1px solid var(--line)}
.sheet .fogo{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
.toast{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14.5px}
.toast i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}.toast svg.l{width:14px;height:14px;stroke-width:2.6}
.ures{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px}.ures svg.ill{width:96px;height:96px}
.ures b{font-size:16px}.ures span{font-size:13.5px;color:var(--muted);max-width:230px}
.unnep{border-radius:22px;background:linear-gradient(160deg,#fff1c7,#ffe4d6);padding:16px;display:flex;gap:12px;align-items:center}
.unnep svg.ill{width:70px;height:70px;flex:none}.unnep b{font-size:17px;display:block}.unnep span{font-size:13px;color:var(--ink2)}
.tab{display:flex;justify-content:space-around;background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 4px 8px;box-shadow:0 10px 30px rgba(20,20,40,.08)}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}.tab .on{color:var(--acc)}
.bill{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bill span{height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;font-weight:500}
.fej .d{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}.fej h3{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.05;margin-top:2px}
/* ikonok */
.ikcs{display:grid;grid-template-columns:repeat(11,1fr);gap:16px 8px;margin-bottom:6px}
.ikcs div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.ikcs svg.l{width:26px;height:26px;color:var(--ink)}
/* illusztrációk */
.ills{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.ills div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.ills svg{width:92px;height:92px}
.ills b{color:var(--ink);font-size:13px;font-weight:600}
</style></head><body><div class="lap">
